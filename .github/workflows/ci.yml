name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install the test browser (WebKit, Safari's engine)
        run: npx playwright install --with-deps webkit

      - name: Browser tests (navigation, F21, labels, security, offline, accessibility, screenshots)
        run: npm run test:e2e

      - name: Keep screenshots and the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-and-report
          path: |
            screenshots/
            playwright-report/
          retention-days: 14
