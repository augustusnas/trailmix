<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Groove Miles: a Trailmix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#16130F}a:hover{color:#1F3D2B}
</style>
</helmet>
<div style="width: 390px; min-height: 1180px; box-sizing: border-box; background: #EADFC8; color: #16130F; font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column">
  <div style="background: #16130F; color: #EADFC8; padding: 28px 20px 24px; border-radius: 0 0 32px 32px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.16em">
      <span style="color: #C8E03A">TRAILMIX<span style="display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 999px; background: #C8E03A; color: #16130F; font-size: 10px; letter-spacing: 0.12em; vertical-align: 1px">BETA</span></span>
      <span>SHARED BY CHARLES</span>
    </div>
    <h1 style="margin: 0; font-size: 60px; line-height: 0.88; font-weight: 800; letter-spacing: -0.045em">Groove Miles</h1>
    <div style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em">INDOOR WALK · STEADY · HOUSE · 45 MIN</div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 6px">
      <div style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.14em">PLAY IT IN</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
          <button type="button" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="min-height: 56px; border-radius: 16px; border: 2px solid {{a.border}}; background: {{a.bg}}; color: {{a.fg}}; font-family: inherit; font-size: 15px; font-weight: 800; line-height: 1.05; cursor: pointer; padding: 0 6px">{{a.name}}</button>
        </sc-for>
      </div>
      <sc-if value="{{isYtm}}" hint-placeholder-val="{{ true }}">
        <a href="#" style="display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 0 22px; margin-top: 4px; background: #E8571E; color: #16130F; text-decoration: none; border-radius: 999px; font-weight: 800; font-size: 17px">
          <span>Open the whole playlist</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>
        </a>
      </sc-if>
      <sc-if value="{{notYtm}}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 15px; line-height: 1.35; padding-top: 4px">Tap any track to open it in {{appName}}.</div>
      </sc-if>
    </div>
  </div>

  <div style="padding: 18px 20px 8px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{phases}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="padding-bottom: 4px">
          <span style="background: {{p.color}}; color: {{p.fg}}; border-radius: 999px; padding: 4px 10px; font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em">{{p.name}}</span>
        </div>
        <sc-for list="{{p.tracks}}" as="t" hint-placeholder-count="2">
          <a href="#" aria-label="{{t.label}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid rgba(22,19,15,0.15); text-decoration: none; color: #16130F">
            <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; width: 22px">{{t.n}}</span>
            <span style="flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0">
              <span style="font-size: 16px; font-weight: 700; line-height: 1.15">{{t.title}}</span>
              <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; color: #4A4238">{{t.artist}}</span>
            </span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M7 17L17 7M9 7h8v8"></path></svg>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 20px 20px 28px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; text-align: center">
    <span>TRAILMIX IS IN INVITE-ONLY BETA</span>
    <span>TRACK LINKS BY SONGLINK/ODESLI</span>
    <span>BUILT BY <a href="https://www.augustusnas.com" target="_blank" rel="noopener" style="color: #16130F; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; display: inline-block; padding: 12px 4px; margin: -12px 0">AUGUSTUS NAS</a></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { app: 'spotify' };
  }
  renderVals() {
    const s = this.state;
    const apps = [
      { id: 'ytm', name: 'YouTube Music' },
      { id: 'spotify', name: 'Spotify' },
      { id: 'apple', name: 'Apple Music' }
    ];
    const current = apps.find((a) => a.id === s.app);
    const tracks = [
      ['Can You Feel It', 'Mr. Fingers'], ['Rain', 'Kerri Chandler'],
      ['When a Fire Starts to Burn', 'Disclosure'], ['Gypsy Woman (She’s Homeless)', 'Crystal Waters'],
      ['Show Me Love', 'Robin S'], ['Music Sounds Better with You', 'Stardust'],
      ['Hypnotized', 'Purple Disco Machine'], ['(It Goes Like) Nanana', 'Peggy Gou'],
      ['Jungle', 'Fred again..'], ['Shades of Jae', 'Moodymann'], ['Glue', 'Bicep']
    ].map(([title, artist], i) => ({
      n: String(i + 1).padStart(2, '0'), title, artist,
      label: 'Open ' + title + ' by ' + artist + ' in ' + current.name
    }));
    return {
      appName: current.name,
      isYtm: s.app === 'ytm',
      notYtm: s.app !== 'ytm',
      apps: apps.map((a) => {
        const on = a.id === s.app;
        return {
          ...a,
          pressed: on ? 'true' : 'false',
          bg: on ? '#C8E03A' : 'transparent',
          fg: on ? '#16130F' : '#EADFC8',
          border: on ? '#C8E03A' : 'rgba(234,223,200,0.55)',
          pick: () => this.setState({ app: a.id })
        };
      }),
      phases: [
        { name: 'WARM-UP', color: '#A99BF5', fg: '#16130F', tracks: tracks.slice(0, 2) },
        { name: 'MAIN BLOCK', color: '#E8571E', fg: '#16130F', tracks: tracks.slice(2, 9) },
        { name: 'COOL-DOWN', color: '#1F3D2B', fg: '#EADFC8', tracks: tracks.slice(9) }
      ]
    };
  }
}
</script>
</body>
</html>
