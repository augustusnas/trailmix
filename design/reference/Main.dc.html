<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trailmix: pick the terrain</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C8E03A}a:hover{color:#EADFC8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16130F; color: #EADFC8; font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.18em">TRAILMIX<span style="display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 999px; background: #C8E03A; color: #16130F; font-size: 10px; letter-spacing: 0.12em; vertical-align: 1px">BETA</span></div>
    <a href="Library.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 2px solid #EADFC8; border-radius: 999px; box-sizing: border-box; color: #EADFC8; text-decoration: none; font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.12em">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #C8E03A"></span>
      <span>LIBRARY</span>
    </a>
  </div>
  <h1 style="margin: 0; font-size: 46px; line-height: 0.92; font-weight: 800; letter-spacing: -0.035em">What’s the terrain today?</h1>
  <sc-if value="{{showCard}}" hint-placeholder-val="{{ true }}">
    <div style="background: #EADFC8; color: #16130F; border-radius: 22px; padding: 10px 8px 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em">LAST SESSION</span>
          <span style="font-size: 20px; font-weight: 800; line-height: 1.05">{{cardTitle}}</span>
        </div>
        <button type="button" onClick="{{dismiss}}" aria-label="Dismiss check-in" style="width: 44px; height: 44px; flex: 0 0 auto; border: 0; background: transparent; color: #16130F; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <sc-if value="{{asking}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-wrap: wrap; gap: 6px; padding-right: 8px">
          <sc-for list="{{answers}}" as="a" hint-placeholder-count="3">
            <button type="button" onClick="{{a.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #16130F; background: transparent; color: #16130F; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">{{a.label}}</button>
          </sc-for>
          <button type="button" onClick="{{toggleFav}}" aria-pressed="{{favPressed}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #16130F; background: {{favBg}}; color: {{favFg}}; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">{{favLabel}}</button>
        </div>
      </sc-if>
    </div>
  </sc-if>
  <div style="flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 10px">
    <sc-for list="{{routines}}" as="item" hint-placeholder-count="5">
      <button type="button" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" style="background: {{item.bg}}; color: {{item.fg}}; outline: {{item.ring}}; outline-offset: 3px; grid-column: {{item.span}}; border: 0; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left; font-family: inherit; cursor: pointer; min-height: 44px">
        <span style="display: flex; justify-content: space-between; font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em">
          <span>{{item.num}}</span>
          <span>{{item.tag}}</span>
        </span>
        <span style="font-size: 27px; line-height: 0.98; font-weight: 800; letter-spacing: -0.02em">{{item.name}}</span>
      </button>
    </sc-for>
    <a href="Library.dc.html" style="border: 2px dashed rgba(234,223,200,0.6); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; color: #EADFC8; text-decoration: none; min-height: 44px">
      <span style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em">3 OF 6</span>
        <span style="width: 44px; height: 44px; border-radius: 50%; background: #1F3D2B; color: #EADFC8; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </span>
      </span>
      <span style="font-size: 27px; line-height: 0.98; font-weight: 800; letter-spacing: -0.02em">Pin another</span>
    </a>
  </div>
  <a href="Tune.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 60px; padding: 0 24px; background: #E8571E; color: #16130F; text-decoration: none; border-radius: 999px; font-weight: 800; font-size: 19px">
    <span>Set the vibe</span>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'walk', checkin: 'ask', fav: false };
  }
  renderVals() {
    const picked = this.state.picked;
    const s = this.state;
    const checkin = {
      showCard: s.checkin !== 'gone',
      asking: s.checkin === 'ask',
      cardTitle: s.checkin === 'ask' ? 'How did Groove Miles do?' : 'Noted. The next mix gets the memo.',
      answers: ['Carried me', 'Dipped midway', 'Didn’t land'].map((label) => ({
        label,
        pick: () => this.setState({ checkin: 'thanks' })
      })),
      favPressed: s.fav ? 'true' : 'false',
      favBg: s.fav ? '#16130F' : 'transparent',
      favFg: s.fav ? '#C8E03A' : '#16130F',
      favLabel: s.fav ? 'New favourite ✓' : '+ New favourite',
      toggleFav: () => this.setState({ fav: !s.fav }),
      dismiss: () => this.setState({ checkin: 'gone' })
    };
    const list = [
      { id: 'walk', num: '01', name: 'Indoor walk', tag: 'CARDIO', bg: '#C8E03A', fg: '#16130F', span: 'auto' },
      { id: 'emom', num: '02', name: 'EMOM', tag: 'CONDITIONING', bg: '#A99BF5', fg: '#16130F', span: 'auto' },
      { id: 'full', num: '03', name: 'Full body', tag: 'STRENGTH', bg: '#EADFC8', fg: '#16130F', span: 'auto' }
    ];
    return {
      ...checkin,
      routines: list.map((r) => ({
        ...r,
        pressed: r.id === picked ? 'true' : 'false',
        ring: r.id === picked ? '3px solid #EADFC8' : 'none',
        pick: () => this.setState({ picked: r.id })
      }))
    };
  }
}
</script>
</body>
</html>
