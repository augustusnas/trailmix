<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trailmix: where do you listen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C8E03A}a:hover{color:#EADFC8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16130F; color: #EADFC8; font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.18em">
    <span>TRAILMIX<span style="display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 999px; background: #C8E03A; color: #16130F; font-size: 10px; letter-spacing: 0.12em; vertical-align: 1px">BETA</span></span>
    <span style="color: #C8E03A">ONE QUICK THING</span>
  </div>
  <h1 style="margin: 0; font-size: 54px; line-height: 0.92; font-weight: 800; letter-spacing: -0.035em">Where do you listen?</h1>
  <p style="margin: 0; font-size: 17px; line-height: 1.35; color: #EADFC8">Every mix goes straight there. You can change it any time in the library.</p>

  <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
      <button type="button" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="flex: 1 1 0; min-height: 44px; border: 0; border-radius: 22px; background: {{a.bg}}; color: #16130F; outline: {{a.ring}}; outline-offset: 3px; padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left; font-family: inherit; cursor: pointer">
        <span style="display: flex; justify-content: space-between; align-items: center; font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em">
          <span>{{a.note}}</span>
          <span style="width: 26px; height: 26px; border-radius: 50%; border: 2px solid #16130F; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
            <span style="width: 12px; height: 12px; border-radius: 50%; background: {{a.dot}}"></span>
          </span>
        </span>
        <span style="font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -0.02em">{{a.name}}</span>
      </button>
    </sc-for>
  </div>

  <a href="Main.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 60px; padding: 0 24px; background: #EADFC8; color: #16130F; text-decoration: none; border-radius: 999px; font-weight: 800; font-size: 19px">
    <span>That’s me</span>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'ytm' };
  }
  renderVals() {
    const picked = this.state.picked;
    const list = [
      { id: 'ytm', name: 'YouTube Music', note: 'SAVES YOUR PLAYLISTS', bg: '#E8571E' },
      { id: 'spotify', name: 'Spotify', note: 'OPENS EVERY TRACK · SAVING SOON', bg: '#C8E03A' },
      { id: 'apple', name: 'Apple Music', note: 'OPENS EVERY TRACK · SAVING SOON', bg: '#A99BF5' }
    ];
    return {
      apps: list.map((a) => {
        const on = a.id === picked;
        return {
          ...a,
          pressed: on ? 'true' : 'false',
          ring: on ? '3px solid #EADFC8' : 'none',
          dot: on ? '#16130F' : 'transparent',
          pick: () => this.setState({ picked: a.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
